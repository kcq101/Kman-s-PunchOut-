<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Kman Knockout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; background:#000; overflow:hidden;
    touch-action:none; overscroll-behavior:none;
    font-family:'Press Start 2P', 'Courier New', monospace;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  #frame { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #stage {
    position:relative; width:100%; height:100%;
    max-width:calc(100vh * 0.5625); max-height:100vh; aspect-ratio:9 / 16;
    background:#000; overflow:hidden;
  }
  canvas#game { display:block; width:100%; height:100%; touch-action:none; }

  /* ---------- Touch controls: 3x3 grid, NES-style punch map ---------- */
  #controls {
    position:absolute; left:0; right:0; bottom:0; height:30%;
    display:grid;
    grid-template-columns:1fr 1.1fr 1fr;
    grid-template-rows:repeat(3, 1fr);
    gap:2%;
    padding:2% 3% calc(2% + env(safe-area-inset-bottom)) 3%;
    touch-action:none;
  }
  .btn {
    display:flex; align-items:center; justify-content:center; text-align:center;
    background:rgba(0,0,0,0.18);
    border:2px solid rgba(255,255,255,0.35);
    border-radius:12px;
    color:rgba(255,255,255,0.9);
    font-size:clamp(7px, 1.8vw, 10px); line-height:1.6;
    text-shadow:1px 1px 0 #000;
    touch-action:none;
    transition:background 50ms linear, transform 50ms linear;
  }
  .btn.active { background:rgba(255,255,255,0.3); transform:scale(0.94); }
  .btn.star   { border-color:rgba(255,210,63,0.7); color:#ffd23f; }
  .btn.block  { grid-column:2; grid-row:2 / span 2; }
  .btn.disabled { opacity:0.35; }

  /* ---------- Overlay: title card, round breaks, results ---------- */
  #mute {
    position:absolute; top:10%; right:2%; z-index:11;
    padding:5px 7px; border-radius:6px;
    border:1px solid rgba(255,255,255,0.45); background:rgba(0,0,0,0.35);
    color:#fff; font-family:inherit; font-size:clamp(6px, 1.6vw, 8px);
    touch-action:none;
  }
  #mute.off { color:#ff9a9a; border-color:rgba(255,154,154,0.6); }
  #overlay {
    position:absolute; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:10%;
    background:rgba(0,0,0,0.78); color:#fff; text-align:center;
  }
  #overlay[hidden] { display:none; }
  #ov-title { font-size:clamp(16px, 5.5vw, 26px); color:#ffd23f; line-height:1.4; }
  #ov-body  { font-size:clamp(7px, 2.2vw, 10px); line-height:2; opacity:0.9; }
  #ov-sub   { font-size:clamp(7px, 2.2vw, 10px); animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0.2; } }
</style>
</head>
<body>
<div id="frame">
  <div id="stage">
    <canvas id="game"></canvas>
    <button id="mute" type="button" aria-label="Toggle sound effects">SFX ON</button>

    <div id="controls">
      <div class="btn" data-action="faceL">L<br>FACE</div>
      <div class="btn star" data-action="star">STAR<br>PUNCH</div>
      <div class="btn" data-action="faceR">R<br>FACE</div>
      <div class="btn" data-action="bodyL">L<br>BODY</div>
      <div class="btn block" data-action="block">BLOCK</div>
      <div class="btn" data-action="bodyR">R<br>BODY</div>
      <div class="btn" data-action="dodgeL">DODGE<br>LEFT</div>
      <div class="btn" data-action="dodgeR">DODGE<br>RIGHT</div>
    </div>

    <div id="overlay" hidden>
      <div id="ov-title"></div>
      <div id="ov-body"></div>
      <div id="ov-sub"></div>
    </div>
  </div>
</div>

  const OPP_ANCHOR    = { x: W / 2, y: 384 };
  const OPP_SCALE = 1.1, PLAYER_SCALE = 1.07;   // Kman drawn 7% larger than Little Mac
  const FONT = '"Press Start 2P", monospace';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  // =====================================================================
  // SOUND — all effects synthesized the way the NES made them: pulse
  // waves at the NES's three duty cycles (12.5 / 25 / 50%), a triangle
  // wave, and a 15-bit LFSR noise channel. No audio files. Each sound
  // is a few numbers in SFX_LIB below, so they're easy to tune.
  // =====================================================================
  const SFX = (() => {
    let ac = null, master = null, noiseBuf = null, muted = false;
    const VOLUME = 0.5;
    const waves = {};
    try { muted = localStorage.getItem('kmanMuted') === '1'; } catch (e) { /* storage unavailable */ }

    function ensure() {
      if (ac) { if (ac.state === 'suspended') ac.resume(); return true; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ac = new AC();
      master = ac.createGain();
      master.gain.value = muted ? 0 : VOLUME;
      const limiter = ac.createDynamicsCompressor();       // keeps stacked bell strikes from distorting
      limiter.threshold.value = -6; limiter.ratio.value = 12; limiter.attack.value = 0.002; limiter.release.value = 0.1;
      master.connect(limiter).connect(ac.destination);
      [0.125, 0.25, 0.5].forEach(duty => {           // NES pulse-channel duty cycles
        const n = 32, re = new Float32Array(n), im = new Float32Array(n);
        for (let k = 1; k < n; k++) re[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * duty);
        waves[duty] = ac.createPeriodicWave(re, im);
      });
      const len = ac.sampleRate;                      // NES-style 15-bit LFSR noise
      noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const ch = noiseBuf.getChannelData(0);
      let reg = 1;
      for (let i = 0; i < len; i++) {
        const bit = (reg ^ (reg >> 1)) & 1;
        reg = (reg >> 1) | (bit << 14);
        ch[i] = (reg & 1) ? 0.8 : -0.8;
      }
      return true;
    }

    // One note: pulse (with duty) or triangle, optional pitch sweep f0 -> f1
    function tone({ wave = 'pulse', duty = 0.5, f0, f1 = f0, dur, vol = 0.3, at = 0 }) {
      const t = ac.currentTime + at;
      const o = ac.createOscillator();
      if (wave === 'pulse') o.setPeriodicWave(waves[duty]); else o.type = wave;
      o.frequency.setValueAtTime(f0, t);
      if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      const g = ac.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(master);
      o.start(t); o.stop(t + dur + 0.02);
    }
    // Noise burst; lower rate = lower, crunchier noise
    function noise({ rate = 1, rate1 = rate, dur, vol = 0.3, at = 0 }) {
      const t = ac.currentTime + at;
      const s = ac.createBufferSource();
      s.buffer = noiseBuf; s.loop = true;
      s.playbackRate.setValueAtTime(rate, t);
      if (rate1 !== rate) s.playbackRate.exponentialRampToValueAtTime(rate1, t + dur);
      const g = ac.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      s.connect(g).connect(master);
      s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
    }

    // The ring bell: a bright metallic strike that rings out
    function bellStrike(at) {
      noise({ rate: 1, dur: 0.03, vol: 0.25, at });                               // clang of the hammer
      tone({ wave: 'triangle', f0: 1046.5, dur: 1.2, vol: 0.6, at });             // body of the bell
      tone({ duty: 0.125, f0: 2093, dur: 0.9, vol: 0.16, at });                   // shimmer
      tone({ duty: 0.25, f0: 2793, dur: 0.3, vol: 0.05, at });                    // metallic overtone
    }

    const SFX_LIB = {
      bell:       () => [0, 0.22, 0.44].forEach(bellStrike),                       // round start: ding-ding-ding
      bellEnd:    () => [0, 0.22, 0.44].forEach(bellStrike),                       // round end
      bellKO:     () => [0, 0.11, 0.22, 0.33, 0.44, 0.55, 0.66].forEach(bellStrike), // KO / TKO frenzy
      hitFace:    () => { noise({ rate: 0.9, rate1: 0.3, dur: 0.12, vol: 0.45 }); tone({ f0: 240, f1: 90, dur: 0.1, vol: 0.18 }); },
      hitBody:    () => { noise({ rate: 0.4, rate1: 0.15, dur: 0.14, vol: 0.5 }); tone({ wave: 'triangle', f0: 150, f1: 60, dur: 0.14, vol: 0.45 }); },
      blocked:    () => { noise({ rate: 0.6, dur: 0.04, vol: 0.25 }); tone({ duty: 0.25, f0: 330, dur: 0.05, vol: 0.1 }); },
      dodge:      () => tone({ duty: 0.125, f0: 300, f1: 900, dur: 0.12, vol: 0.26 }),
      ouch:       () => { noise({ rate: 0.25, rate1: 0.08, dur: 0.3, vol: 0.6 }); tone({ wave: 'triangle', f0: 180, f1: 45, dur: 0.3, vol: 0.5 }); },
      tell:       () => tone({ duty: 0.25, f0: 1568, dur: 0.05, vol: 0.15 }),
      star:       () => [1047, 1319, 1568, 2093].forEach((f, i) => tone({ f0: f, dur: 0.1, vol: 0.31, at: i * 0.06 })),
      starCharge: () => tone({ duty: 0.125, f0: 200, f1: 1400, dur: 0.3, vol: 0.26 }),
      starHit:    () => { noise({ rate: 1, rate1: 0.1, dur: 0.5, vol: 0.6 }); tone({ wave: 'triangle', f0: 320, f1: 40, dur: 0.45, vol: 0.5 }); },
      fall:       () => { noise({ rate: 0.2, rate1: 0.05, dur: 0.6, vol: 0.6 }); tone({ wave: 'triangle', f0: 90, f1: 35, dur: 0.5, vol: 0.5 }); },
      count:      () => tone({ f0: 880, dur: 0.1, vol: 0.32 }),
      countTen:   () => tone({ f0: 1760, dur: 0.4, vol: 0.35 }),
      tired:      () => tone({ duty: 0.25, f0: 196, dur: 0.12, vol: 0.24 }),
      menu:       () => tone({ f0: 1319, dur: 0.04, vol: 0.2 }),
      confirm:    () => { tone({ f0: 1047, dur: 0.06, vol: 0.24 }); tone({ f0: 2093, dur: 0.12, vol: 0.24, at: 0.06 }); },
      miss:       () => tone({ duty: 0.125, f0: 500, f1: 250, dur: 0.08, vol: 0.13 }),
    };

    return {
      unlock: ensure,
      play(name) {
        if (muted || !ensure()) return;
        try { SFX_LIB[name](); } catch (e) { /* never let audio break the game */ }
      },
      get muted() { return muted; },
      toggleMute() {
        muted = !muted;
        if (master) master.gain.value = muted ? 0 : VOLUME;
        try { localStorage.setItem('kmanMuted', muted ? '1' : '0'); } catch (e) { /* storage unavailable */ }
        return muted;
      },
    };
  })();
  // Phones only allow audio after a tap; the first tap anywhere unlocks it.
  window.addEventListener('pointerdown', () => SFX.unlock(), { capture: true, passive: true });

  const muteBtn = document.getElementById('mute');
  const syncMuteBtn = () => { muteBtn.textContent = SFX.muted ? 'SFX OFF' : 'SFX ON'; muteBtn.classList.toggle('off', SFX.muted); };
  muteBtn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); SFX.toggleMute(); syncMuteBtn(); });
  syncMuteBtn();


  // =====================================================================
  // INPUT — Pointer Events (touch + mouse), multi-touch safe, tap-buffered
  // =====================================================================
  const ACTIONS = ['faceL', 'faceR', 'bodyL', 'bodyR', 'dodgeL', 'dodgeR', 'block', 'star'];
  const Input = { held: {}, pressed: {}, taps: 0 };
  ACTIONS.forEach(a => { Input.held[a] = false; Input.pressed[a] = false; });
  const buttons = Array.from(document.querySelectorAll('.btn'));
  const btnFor = a => buttons.find(b => b.dataset.action === a);
  const owners = new Map(); // pointerId -> button

  function setActive(btn, on) {
    const a = btn.dataset.action;
    if (on && !Input.held[a]) { Input.pressed[a] = true; Input.taps++; }
    Input.held[a] = on;
    btn.classList.toggle('active', on);
  }
  function release(id) {
    const b = owners.get(id);
    if (!b) return;
    owners.delete(id);
    if (![...owners.values()].includes(b)) setActive(b, false);
  }
  function releaseAll() { owners.clear(); buttons.forEach(b => setActive(b, false)); }

  buttons.forEach(btn => {
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      owners.set(e.pointerId, btn);
      setActive(btn, true);
    });
  });
  window.addEventListener('pointerup', e => release(e.pointerId));
  window.addEventListener('pointercancel', e => release(e.pointerId));
  window.addEventListener('pointermove', e => {
    const b = owners.get(e.pointerId);
    if (b && !b.contains(document.elementFromPoint(e.clientX, e.clientY))) release(e.pointerId);
  });
  window.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('blur', releaseAll);
  function consumePressed() { ACTIONS.forEach(a => { Input.pressed[a] = false; }); Input.taps = 0; }

  // =====================================================================
  // STATE
  // =====================================================================
  const mac = {}, opp = {}, game = {};
  const popups = [];
  function popup(text, y, color = '#fff', big = false) {
    if (popups.length > 5) popups.shift();
    popups.push({ text, y, color, big, life: 50 });
  }
  const OPP_Y = 170, MAC_Y = 330;
  const rand = (a, b) => a + Math.random() * (b - a);

  function newMatch() {
    Object.assign(game, {
      phase: 'title', t: 0, round: 1, clock: 0, points: 0, shake: 0,
      macHitThisFight: false, oppKdTotal: 0, macKdTotal: 0,
      kdRound: { opp: 0, mac: 0 }, tauntDone: false,
      count: 0, riseAt: 99, getUpNeed: 0, getUpTaps: 0, pending: null,
    });
    Object.assign(mac, { hp: RULES.macMaxHp, stars: 0 });
    Object.assign(opp, { hp: F.maxHp });
    Object.assign(game, { menuIdx: 0, menuMsg: 0, leave: 0, hasSave: false });
  }

  function resetMacRound() {
    Object.assign(mac, {
      hearts: F.startHearts, tired: false,
      punchTimer: 0, punchSide: 1, punchTarget: 'face', cd: 0,
      dodgeTimer: 0, dodgeSide: 1, dodgeCd: 0, blocking: false,
      hitStun: 0, starTimer: 0, starAnim: 0, anim: 0, buffer: null, bufferTtl: 0,
    });
  }
  function resetOppStance() {
    Object.assign(opp, { guard: 'body', guardTarget: 'body', guardTimer: 0, chain: 0, anim: 0,
      lastHit: 'face', hitTimer: 0, blockAnim: 0, starHit: 0, bellyHits: 0 });
    resetPattern();
    setOpp('IDLE');
  }
  function resetPattern() { opp.queue = []; opp.setIdx = 0; }

  function startRound(n) {
    game.round = n;
    game.clock = 0;
    game.kdRound = { opp: 0, mac: 0 };
    game.tauntDone = false;
    resetMacRound();
    resetOppStance();          // every round opens with his low-guard stance
    setPhase('intro');
  }
  function setPhase(p) { game.phase = p; game.t = 0; }

  // =====================================================================
  // OPPONENT AI — deterministic script, no randomness
  // =====================================================================
  const windupLength = move => move.windup.reduce((s, [, t]) => s + t, 0);
  function tellTick(move) {                    // tick at which his flash frame starts
    let acc = 0;
    for (const [key, ticks] of move.windup) { if (key === move.tell) return acc; acc += ticks; }
    return -1;
  }

  function setOpp(state) {
    opp.state = state;
    opp.t = 0;
    if (state === 'IDLE') opp.wait = opp.queue.length ? F.gapInSet : F.gapBetweenSets;
    if (state === 'WINDUP') opp.pendingStun = false;
  }
  function moveGuard(target) {
    if (opp.guardTarget !== target) { opp.guardTarget = target; opp.guardTimer = F.guardShiftDelay; }
  }
  function nextSet() {
    if (game.round === 1 && game.oppKdTotal === 0) return F.openingSet.slice();
    const set = F.setRotation[opp.setIdx % F.setRotation.length];
    opp.setIdx++;
    return set.slice();
  }
  function startMove(name) { opp.move = F.moves[name]; opp.moveName = name; setOpp('WINDUP'); }

  function decideNext() {
    if (!game.tauntDone && F.tauntAt[game.round] !== undefined && game.clock >= F.tauntAt[game.round]) {
      game.tauntDone = true;
      resetPattern();
      setOpp('TAUNT_BACK');
      return;
    }
    if (F.passiveRound1 && game.round === 1 && !game.tauntDone && game.oppKdTotal === 0) {
      setOpp('IDLE');       // passive mode: just stands and guards
      return;
    }
    if (mac.tired) { startMove('uppercut'); return; }   // he punishes a tired Mac
    if (!opp.queue.length) opp.queue = nextSet();
    startMove(opp.queue.shift());
  }

  function updateOpp() {
    const o = opp;
    o.t++; o.anim++;
    if (o.hitTimer > 0) o.hitTimer--;
    if (o.blockAnim > 0) o.blockAnim--;
    if (o.starHit > 0) o.starHit--;
    if (o.guardTimer > 0 && --o.guardTimer === 0) o.guard = o.guardTarget;

    switch (o.state) {
      case 'IDLE':    if (o.t >= o.wait) decideNext(); break;
      case 'WINDUP':
        if (o.t === tellTick(o.move)) SFX.play('tell');     // audible tell as he flashes
        if (o.t >= windupLength(o.move)) setOpp('STRIKE');
        break;
      case 'STRIKE':
        if (o.t === 1) resolveStrike();
        if (o.t >= o.move.strike && game.phase === 'fight') setOpp(o.pendingStun ? 'STUNNED' : 'RECOVER');
        break;
      case 'RECOVER': if (o.t >= o.move.recover) setOpp('IDLE'); break;
      case 'STUNNED':   // you dodged or blocked: he's open for a few counters
        if (o.t >= RULES.stunnedMaxTicks || o.countersLeft <= 0) setOpp('REGUARD');
        break;
      case 'REGUARD':   // getting back in position — a face jab here earns a star
        if (o.t >= 14) { o.guard = o.guardTarget = 'face'; o.guardTimer = 0; setOpp('IDLE'); }
        break;
      case 'DOUBLED':   // belly-over: stays bent while you keep working the gut
        if (o.t >= F.belly.window && mac.starTimer === 0) {
          o.guard = o.guardTarget = 'body'; o.guardTimer = 0;   // straightens up, covering the gut
          setOpp('IDLE');
        }
        break;
      case 'HIT':     if (o.t >= 14) setOpp('IDLE'); break;
      case 'TAUNT_BACK': if (o.t >= 36) setOpp('TAUNT'); break;
      case 'TAUNT':
        if (o.t === 1) popup(F.tauntQuote, OPP_Y - 20, '#ffd23f');
        if (o.t >= 60) setOpp('CHARGE');
        break;
      case 'CHARGE':
        if (o.t >= 28) { resetPattern(); startMove('uppercut'); o.state = 'STRIKE'; o.t = 0; }
        break;
      case 'GETUP':   if (o.t >= 30) setOpp('IDLE'); break;
    }
  }

  function resolveStrike() {
    const m = opp.move;
    if (mac.dodgeTimer > 0) {
      opp.pendingStun = true;
      opp.countersLeft = m.counters;
      popup('DODGE!', MAC_Y, '#7dff9a');
      if (mac.tired) recoverHearts();
    } else if (mac.blocking) {
      opp.pendingStun = true;
      opp.countersLeft = F.blockCounters;
      mac.hp = Math.max(1, mac.hp - RULES.blockChip);
      popup('BLOCK', MAC_Y, '#8cc8ff');
      if (mac.tired) recoverHearts();
    } else {
      hitMac(m.damage);
    }
  }

  // =====================================================================
  // MAC
  // =====================================================================
  function loseHearts(n) {
    mac.hearts = Math.max(0, mac.hearts - n);
    if (mac.hearts === 0 && !mac.tired) { mac.tired = true; popup('TIRED!', MAC_Y, '#ff9ad0'); SFX.play('tired'); }
  }
  function recoverHearts() {
    mac.hearts = Math.min(F.startHearts, mac.hearts + RULES.tiredHeartsOnDodge);
    if (mac.hearts > 0) mac.tired = false;
  }

  function hitMac(dmg) {
    mac.hp = Math.max(0, mac.hp - dmg);
    game.macHitThisFight = true;
    SFX.play('ouch');
    loseHearts(RULES.heartLossHit);
    if (mac.stars > 0) { mac.stars--; popup('STAR LOST', MAC_Y + 18, '#ff8a8a'); }
    mac.hitStun = RULES.macHitStun;
    mac.punchTimer = 0; mac.starTimer = 0;
    game.shake = 12;
    popup('OUCH!', MAC_Y, '#ff5a5a');
    if (mac.hp === 0) knockdownMac();
  }

  function updateMac() {
    const m = mac;
    m.anim++;
    if (m.punchTimer > 0) m.punchTimer--;
    if (m.cd > 0) m.cd--;
    if (m.starAnim > 0) m.starAnim--;
    if (m.dodgeTimer > 0) { if (--m.dodgeTimer === 0) m.dodgeCd = RULES.dodgeRecovery; }
    else if (m.dodgeCd > 0) m.dodgeCd--;

    if (m.tired && m.anim % 50 === 0) SFX.play('tired');     // warning pulse while pink
    if (m.hitStun > 0) { m.hitStun--; m.blocking = false; return; }
    if (m.starTimer > 0) { if (--m.starTimer === 0) landStar(); return; }

    const dodging = m.dodgeTimer > 0;
    m.blocking = Input.held.block && !dodging && m.punchTimer === 0;

    if (!dodging && m.dodgeCd === 0 && (Input.pressed.dodgeL || Input.pressed.dodgeR)) {
      m.dodgeSide = Input.pressed.dodgeL ? -1 : 1;
      m.dodgeTimer = RULES.dodgeActive;
      SFX.play('dodge');
      m.punchTimer = 0; m.blocking = false; m.buffer = null;
      return;
    }

    // Input buffer: a punch tapped while Mac is still finishing the last
    // one fires the moment he can throw, so fast combos never drop a tap.
    const p = Input.pressed;
    const tapped = p.star ? 'star' : p.faceL ? 'faceL' : p.faceR ? 'faceR' : p.bodyL ? 'bodyL' : p.bodyR ? 'bodyR' : null;
    if (tapped) { m.buffer = tapped; m.bufferTtl = RULES.inputBuffer; }
    else if (m.bufferTtl > 0 && --m.bufferTtl === 0) m.buffer = null;
    if (dodging || m.blocking || m.cd > 0 || !m.buffer) return;

    const b = m.buffer;
    m.buffer = null; m.bufferTtl = 0;
    if (b === 'star') { throwStar(); return; }
    if (m.tired) { popup('TOO TIRED', MAC_Y, '#ff9ad0'); return; }
    throwPunch(b.endsWith('L') ? -1 : 1, b.startsWith('face') ? 'face' : 'body');
  }

  function throwPunch(side, target) {
    mac.punchTimer = RULES.punchAnim;
    mac.punchSide = side;
    mac.punchTarget = target;
    mac.cd = RULES.punchCooldown;
    const o = opp;
    const dmg = target === 'face' ? RULES.faceDmg : RULES.bodyDmg;

    switch (o.state) {
      case 'STUNNED':
        landHit(RULES.counterDmg, 20, target);
        o.countersLeft--;
        break;
      case 'REGUARD':
        if (target === 'face') { landHit(dmg, 10, target); awardStar(); setOpp('HIT'); }
        else blocked();
        break;
      case 'WINDUP':
        if (target === o.move.intercept) {
          awardStar();
          resetPattern();
          if (target === 'body') enterBellyOver();          // gut punch stops his jab: he doubles over
          else { landHit(dmg, 10, target); if (game.phase === 'fight') setOpp('HIT'); }
        } else blocked();
        break;
      case 'DOUBLED':
        if (target === 'body') {
          if (o.bellyHits < F.belly.maxBodyHits) {
            o.bellyHits++;
            landHit(dmg, 20, 'body');
            if (game.phase === 'fight') o.t = 0;            // keeps him bent over
          } else {                                          // he covers up
            o.guard = o.guardTarget = 'body'; o.guardTimer = 0;
            blocked(); setOpp('IDLE');
          }
        } else {                                            // the finishing face punch
          const combo = o.bellyHits >= F.belly.starAfter;
          landHit(Math.round(dmg * 1.5), combo ? 100 : 30, 'face');
          if (game.phase !== 'fight') break;
          if (combo) { popup('COMBO!', OPP_Y + 18, '#7dff9a'); awardStar(); }
          o.guard = o.guardTarget = 'body'; o.guardTimer = 0;
          setOpp('HIT');
        }
        break;
      case 'CHARGE':
        if (target === 'face') {
          popup('COUNTER!', OPP_Y, '#ffd23f', true);
          if (F.glassJaw) knockdownOpp(true); else landHit(dmg * 2, 50);
        } else blocked();
        break;
      case 'TAUNT_BACK': case 'TAUNT':
        popup('MISS', OPP_Y, '#bbb');
        SFX.play('miss');
        break;
      case 'HIT': case 'IDLE': case 'RECOVER':
        if (target === o.guard || (o.state === 'HIT' && o.chain >= RULES.chainLimit)) {
          o.guard = o.guardTarget = target; o.guardTimer = 0;
          blocked();
        } else if (target === 'body') {
          enterBellyOver();                                 // clean gut shot while his gloves are up
        } else {
          o.chain = o.state === 'HIT' ? o.chain + 1 : 1;
          landHit(dmg, 10, 'face');
          if (game.phase === 'fight') { setOpp('HIT'); moveGuard('face'); }
        }
        break;
      default: // STRIKE, GETUP
        blocked();
    }
  }

  function enterBellyOver() {
    landHit(RULES.bodyDmg, 20, 'body');
    if (game.phase !== 'fight') return;
    opp.bellyHits = 1;
    opp.chain = 0;
    setOpp('DOUBLED');
  }

  function blocked() {
    opp.blockAnim = 10;
    SFX.play('blocked');
    loseHearts(RULES.heartLossBlocked);
    popup('BLOCKED', OPP_Y, '#bbb');
  }
  function landHit(dmg, pts, target = 'face') {
    opp.lastHit = target;
    opp.hitTimer = 10;
    SFX.play(target === 'body' ? 'hitBody' : 'hitFace');
    opp.hp = Math.max(0, opp.hp - dmg);
    game.points += pts;
    if (opp.hp === 0) knockdownOpp(false);
  }
  function awardStar() {
    if (mac.stars < RULES.maxStars) { mac.stars++; popup('★ STAR!', OPP_Y - 22, '#ffd23f'); SFX.play('star'); }
  }

  function throwStar() {
    if (mac.stars === 0) { popup('NO STARS', MAC_Y, '#bbb'); return; }
    if (mac.tired) { popup('TOO TIRED', MAC_Y, '#ff9ad0'); return; }
    mac.stars--;
    mac.starTimer = RULES.starWindup;
    SFX.play('starCharge');
  }
  function landStar() {
    mac.starAnim = 14;
    mac.cd = RULES.punchCooldown;
    const s = opp.state;
    if (s === 'TAUNT_BACK' || s === 'TAUNT' || s === 'GETUP') { popup('MISS', OPP_Y, '#bbb'); SFX.play('miss'); return; }
    game.shake = 10;
    popup('STAR PUNCH!', OPP_Y, '#ffd23f', true);
    SFX.play('starHit');
    opp.starHit = 20;
    if (s === 'DOUBLED' && F.belly.starKnocksDown) { game.points += 500; knockdownOpp(false); return; }
    if (F.glassJaw && !game.macHitThisFight) { game.points += 500; knockdownOpp(false); return; }
    const open = s === 'STUNNED' || s === 'HIT' || s === 'REGUARD';
    landHit(open ? RULES.starDmgStunned : RULES.starDmgStanding, 300);
    if (game.phase === 'fight') setOpp('HIT');
  }

  // =====================================================================
  // KNOCKDOWNS & COUNTS
  // =====================================================================
  function knockdownOpp(tauntKO) {
    game.kdRound.opp++;
    game.oppKdTotal++;
    game.points += 1000;
    game.shake = 16;
    game.count = 0;
    opp.state = 'DOWN'; opp.t = 0;
    const idx = Math.min(game.oppKdTotal - 1, F.getUp.length - 1);
    const stay = tauntKO ? F.tauntKoStayDown : F.getUp[idx].stayDown;
    game.riseAt = Math.random() < stay ? 99 : (tauntKO ? 1 : F.getUp[idx].count);
    game.riseHp = F.maxHp * F.hpOnGetUp[Math.min(idx, F.hpOnGetUp.length - 1)];
    popup('DOWN!', OPP_Y, '#ffd23f', true);
    SFX.play('fall');
    setPhase('oppDown');
  }

  function knockdownMac() {
    game.kdRound.mac++;
    game.macKdTotal++;
    game.count = 0;
    game.getUpTaps = 0;
    game.getUpNeed = RULES.macGetUpTaps[Math.min(game.macKdTotal - 1, RULES.macGetUpTaps.length - 1)];
    SFX.play('fall');
    setPhase('macDown');
  }

  function updateOppDown() {
    if (game.kdRound.opp >= RULES.tkoKnockdowns) { if (game.t >= 90) endMatch('player', 'T.K.O.'); return; }
    if (game.t < 40 || (game.t - 40) % RULES.countTicks !== 0) return;
    game.count++;
    SFX.play(game.count >= 10 ? 'countTen' : 'count');
    if (game.count >= 10) { endMatch('player', 'K.O.'); return; }
    if (game.count === game.riseAt) {
      opp.hp = Math.round(game.riseHp);
      resetOppStance();
      setOpp('GETUP');
      game.count = 0;
      setPhase('fight');
    }
  }

  function updateMacDown() {
    if (game.kdRound.mac >= RULES.tkoKnockdowns) { if (game.t >= 90) endMatch('opponent', 'T.K.O.'); return; }
    if (game.t > 40) game.getUpTaps += Input.taps;
    if (game.getUpTaps >= game.getUpNeed) {
      const idx = Math.min(game.macKdTotal - 1, RULES.macHpOnGetUp.length - 1);
      mac.hp = Math.round(RULES.macMaxHp * RULES.macHpOnGetUp[idx]);
      resetMacRound();
      mac.hearts = Math.ceil(F.startHearts / 2);
      resetOppStance();
      game.count = 0;
      setPhase('fight');
      return;
    }
    if (game.t >= 40 && (game.t - 40) % RULES.countTicks === 0) {
      game.count++;
      SFX.play(game.count >= 10 ? 'countTen' : 'count');
      if (game.count >= 10) endMatch('opponent', 'K.O.');
    }
  }

  // =====================================================================
  // ROUNDS & RESULTS
  // =====================================================================
  function updateClock() {
    game.clock += RULES.clockSpeed / 60;
    if (game.clock >= RULES.roundSeconds) {
      game.clock = RULES.roundSeconds;
      endRound();
    }
  }

  function endRound() {
    setPhase('break');
    releaseAll();
    if (game.round >= RULES.rounds) {
      // Decision: points decide, and you need to have out-worked him.
      const won = game.points >= 1500 && mac.hp > opp.hp;
      endMatch(won ? 'player' : 'opponent', 'DECISION');
      return;
    }
    SFX.play('bellEnd');
    const tip = F.tips[(game.round - 1) % F.tips.length];
    showOverlay(`END OF ROUND ${game.round}`, `DOC SAYS:<br>${tip}`, 'TAP FOR NEXT ROUND', () => {
      mac.hp = Math.min(RULES.macMaxHp, mac.hp + RULES.macMaxHp * RULES.betweenRoundHeal);
      startRound(game.round + 1);
    });
  }

  function endMatch(winner, how) {
    if (game.phase === 'over') return;
    setPhase('over');
    game.winner = winner;
    SFX.play(how === 'DECISION' ? 'bellEnd' : 'bellKO');
    releaseAll();
    const title = winner === 'player' ? `${how}<br>YOU WIN!` : `${how}<br>YOU LOSE`;
    setTimeout(() => {
      showOverlay(title, `POINTS ${game.points}`, 'TAP TO CONTINUE', newMatch);
    }, 1200);
  }

  // =====================================================================
  // OVERLAY
  // =====================================================================
  const ov = document.getElementById('overlay');
  let ovAction = null;
  function showOverlay(title, body, sub, onTap) {
    document.getElementById('ov-title').innerHTML = title;
    document.getElementById('ov-body').innerHTML = body;
    document.getElementById('ov-sub').textContent = sub;
    ovAction = onTap;
    ov.hidden = false;
  }
  ov.addEventListener('pointerup', () => {
    if (!ovAction) return;
    const fn = ovAction;
    ovAction = null;
    ov.hidden = true;
    releaseAll();
    fn();
  });

  // =====================================================================
  // RENDERING
  // =====================================================================
  // Tinted copies of a whole sheet (hit flash, wind-up glow, tired pink),
  // built once per color and cached.
  const tintCache = new Map();
  function sheetFor(who, tint) {
    const img = getImage(who);
    if (!img || !tint) return img;
    const id = who + tint[0] + tint[1];
    let c = tintCache.get(id);
    if (!c) {
      c = document.createElement('canvas');
      c.width = img.width; c.height = img.height;
      const g = c.getContext('2d');
      g.drawImage(img, 0, 0);
      g.globalCompositeOperation = 'source-atop';
      g.globalAlpha = tint[1];
      g.fillStyle = tint[0];
      g.fillRect(0, 0, c.width, c.height);
      tintCache.set(id, c);
    }
    return c;
  }

  // Draw one frame with the fighter's feet at (ax, ay). Mirroring flips
  // around the feet, so a mirrored pose stays planted in the same spot.
  function drawFrame(who, key, ax, ay, scale, flip = false, tint = null) {
    const f = SHEETS[who].frames[key];
    const src = sheetFor(who, tint);
    if (!src || !f) {
      ctx.fillStyle = who === 'mac' ? '#3ad06c' : '#e0475a';
      ctx.fillRect(ax - 30, ay - 130, 60, 130);
      return 130;
    }
    const w = Math.round(f.w * scale), h = Math.round(f.h * scale);
    ctx.save();
    ctx.translate(Math.round(ax), Math.round(ay));
    if (flip) ctx.scale(-1, 1);
    ctx.drawImage(src, f.x, f.y, f.w, f.h, Math.round(-f.ax * scale), -h, w, h);
    ctx.restore();
    return h;
  }
  // Pick a frame from a sequence by progress 0..1
  const seq = (list, k) => list[Math.min(list.length - 1, Math.max(0, Math.floor(k * list.length)))];
  // Cycle a looping sequence every `every` ticks
  const loop = (list, t, every) => list[Math.floor(t / every) % list.length];
  const lerp = (a, b, k) => a + (b - a) * Math.min(1, Math.max(0, k));

  function drawRing() {
    const bg = getImage('background');
    ctx.fillStyle = '#5c95ff';
    ctx.fillRect(-20, -20, W + 40, H + 40);
    if (bg) ctx.drawImage(bg, 0, HUD_H, W, bg.height * (W / bg.width));
  }

  // Frame at tick t within a [frame, ticks] timeline
  function timelineFrame(timeline, t) {
    let acc = 0;
    for (const [key, ticks] of timeline) { acc += ticks; if (t < acc) return key; }
    return timeline[timeline.length - 1][0];
  }

  function drawOpponent() {
    const o = opp;
    const A = JOE_ANIM;
    let key = loop(o.guard === 'face' ? A.idleHigh : A.idleLow, o.anim, 12);
    let dx = 0, dy = 0, scale = OPP_SCALE;

    if (game.phase === 'over' && game.winner === 'opponent') {
      key = loop(A.win, o.anim, 20);
    } else switch (o.state) {
      case 'WINDUP':
        key = timelineFrame(o.move.windup, o.t);          // includes his flash tell
        break;
      case 'STRIKE':
        key = o.move.strikeFrame;
        scale = OPP_SCALE * 1.08; dy = 14;
        break;
      case 'RECOVER':
        if (o.t < 8) { key = o.move.strikeFrame; dy = 6; }
        break;
      case 'STUNNED':                                       // overextended after you slipped his punch
        key = o.hitTimer > 0 ? (o.lastHit === 'body' ? A.bellyOver[0] : A.hitFace[0])
            : (o.t < 10 ? o.move.strikeFrame : A.idleLow[0]);
        break;
      case 'REGUARD':
        key = A.idleHigh[0];
        break;
      case 'DOUBLED':
        key = A.bellyOver[o.bellyHits % 2];
        dy = 4;
        break;
      case 'HIT':
        if (o.starHit > 0) key = loop(A.dizzy, o.t, 8);
        else key = o.lastHit === 'body' ? A.bellyOver[0] : A.hitFace[0];
        dy = o.lastHit === 'face' ? -4 : 0;
        break;
      case 'TAUNT_BACK':
        key = loop(A.idleHigh, o.t, 10);
        scale = lerp(OPP_SCALE, OPP_SCALE * 0.88, o.t / 36);
        dy = lerp(0, -18, o.t / 36);
        break;
      case 'TAUNT':
        key = loop(A.taunt, o.t, 15);
        scale = OPP_SCALE * 0.88; dy = -18;
        break;
      case 'CHARGE':
        key = loop(A.idleLow, o.t, 6);
        scale = lerp(OPP_SCALE * 0.88, OPP_SCALE * 1.08, o.t / 28);
        dy = lerp(-18, 8, o.t / 28);
        break;
      case 'DOWN':
        key = seq(A.down, Math.min(1, o.t / 24));
        break;
      case 'GETUP':
        key = seq(A.getUp, o.t / 30);
        break;
      default: // IDLE
        if (o.blockAnim > 0) key = A.block[0];
        else if (o.hitTimer > 0) key = o.lastHit === 'body' ? A.bellyOver[0] : A.hitFace[0];
    }
    if (o.hitTimer > 6 && o.state !== 'DOWN') dx += (o.hitTimer % 2 ? 3 : -3);   // impact shake

    drawFrame('joe', key, OPP_ANCHOR.x + dx, OPP_ANCHOR.y + dy, scale, false, null);
  }

  function drawDizzyStars(cx, cy, t) {
    ctx.fillStyle = '#ffe14d';
    for (let i = 0; i < 3; i++) {
      const a = t * 0.12 + i * (Math.PI * 2 / 3);
      ctx.fillRect(Math.round(cx + Math.cos(a) * 22) - 3, Math.round(cy + Math.sin(a) * 6) - 3, 6, 6);
    }
  }

  function drawPlayer() {
    const m = mac;
    const A = MAC_ANIM;
    let key = loop(A.idle, m.anim, 16);
    let dx = 0, dy = 0, flip = false, tint = null;

    if (game.phase === 'macDown') {
      key = A.down[0];
    } else if (game.phase === 'over' && game.winner === 'player') {
      key = loop(A.win, m.anim, 20);
    } else if (m.starTimer > 0) {
      // wind-up: first half of the star uppercut sequence
      key = seq(A.star.slice(0, 3), 1 - m.starTimer / RULES.starWindup);
      if (Math.floor(m.starTimer / 3) % 2 === 0) tint = ['#ffe14d', 0.45];
    } else if (m.starAnim > 0) {
      key = seq(A.star.slice(3), 1 - m.starAnim / 14);
      dy = -10;
    } else if (m.hitStun > 0) {
      key = m.hitStun > RULES.macHitStun - 10 ? A.hit[0] : A.hit[1];
    } else if (m.dodgeTimer > 0) {
      // lean out, hold, lean back in
      const e = RULES.dodgeActive - m.dodgeTimer;
      key = e < 3 ? A.dodge[0] : e < 6 ? A.dodge[1] : m.dodgeTimer < 5 ? A.dodge[1] : A.dodge[2];
      flip = m.dodgeSide > 0;
      dx = m.dodgeSide * 10;
    } else if (m.punchTimer > 0) {
      const list = m.punchSide < 0 ? A.punchL : A.punchR;
      const k = 1 - m.punchTimer / RULES.punchAnim;
      // body shots stop short of full extension and land lower
      key = m.punchTarget === 'face' ? seq(list, k) : seq(list.slice(0, 2), k);
      dy = m.punchTarget === 'face' ? -8 : 2;
    } else if (m.blocking) {
      key = A.block[0];
    }

    if (m.hitStun > 0 && Math.floor(m.hitStun / 4) % 2 === 0) tint = ['#ff2020', 0.45];
    else if (m.tired && !tint) tint = ['#ff7ac8', 0.45];   // the classic pink, tired Mac

    drawFrame('mac', key, PLAYER_ANCHOR.x + dx, PLAYER_ANCHOR.y + dy, PLAYER_SCALE, flip, tint);
  }

  // ---- HUD (NES-style top bar) ----
  function drawHeart(x, y) {
    ctx.fillStyle = '#ff4d6d';
    [[1,0,2],[4,0,2],[0,1,7],[0,2,7],[1,3,5],[2,4,3],[3,5,1]]
      .forEach(([cx, cy, w]) => ctx.fillRect(x + cx * 1.5, y + cy * 1.5, w * 1.5, 1.5));
  }
  function drawStar(x, y, r, filled) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5;
      const rr = i % 2 ? r * 0.45 : r;
      ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath();
    if (filled) { ctx.fillStyle = '#ffd23f'; ctx.fill(); }
    else { ctx.strokeStyle = 'rgba(255,210,63,0.35)'; ctx.lineWidth = 1; ctx.stroke(); }
  }
  function drawBar(x, y, w, pct, color, label) {
    ctx.fillStyle = '#fff';
    ctx.fillText(label, x, y + 7);
    const bx = x + 34;
    ctx.fillStyle = '#333'; ctx.fillRect(bx, y, w, 8);
    ctx.fillStyle = color;  ctx.fillRect(bx, y, Math.round(w * Math.max(0, pct)), 8);
  }
  function drawHUD() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, HUD_H);
    ctx.font = '8px ' + FONT;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';

    // row 1: hearts, stars, points, round & clock
    drawHeart(10, 9);
    ctx.fillStyle = mac.tired ? '#ff7ac8' : '#fff';
    ctx.fillText(String(mac.hearts ?? 0).padStart(2, '0'), 24, 19);
    for (let i = 0; i < RULES.maxStars; i++) drawStar(60 + i * 14, 15, 5, i < mac.stars);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText(String(game.points).padStart(6, '0'), W / 2 + 10, 19);
    ctx.textAlign = 'right';
    const secs = Math.floor(game.clock);
    ctx.fillText(`R${game.round} ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`, W - 10, 19);

    // row 2: stamina bars
    ctx.textAlign = 'left';
    drawBar(10, 34, 120, mac.hp / RULES.macMaxHp, '#3ad06c', 'KMAN');
    drawBar(W / 2 + 12, 34, 120, opp.hp / F.maxHp, '#e0475a', F.short);
  }

  function drawCenterText(text, y, size, color) {
    ctx.font = `${size}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#000';
    ctx.fillText(text, W / 2 + 3, y + 3);
    ctx.fillStyle = color;
    ctx.fillText(text, W / 2, y);
  }

  function drawPhaseText() {
    if (game.phase === 'intro') {
      drawCenterText(game.t < 50 ? `ROUND ${game.round}` : 'FIGHT!', 250, 22, '#ffd23f');
    }
    if ((game.phase === 'oppDown' || game.phase === 'macDown') && game.count > 0) {
      drawCenterText(String(game.count), 250, 40, '#fff');
    }
    if (game.phase === 'macDown' && game.kdRound.mac < RULES.tkoKnockdowns) {
      drawCenterText('TAP FAST TO GET UP!', 300, 10, '#ffd23f');
      const pct = Math.min(1, game.getUpTaps / game.getUpNeed);
      ctx.fillStyle = '#333'; ctx.fillRect(W / 2 - 80, 312, 160, 8);
      ctx.fillStyle = '#7dff9a'; ctx.fillRect(W / 2 - 80, 312, 160 * pct, 8);
    }
  }

  function drawPopups() {
    ctx.textAlign = 'center';
    for (const p of popups) {
      ctx.globalAlpha = Math.min(1, p.life / 15);
      ctx.font = `${p.big ? 14 : 10}px ${FONT}`;
      ctx.fillStyle = '#000';
      ctx.fillText(p.text, W / 2 + 2, p.y + 2);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, W / 2, p.y);
    }
    ctx.globalAlpha = 1;
  }
  function updatePopups() {
    for (let i = popups.length - 1; i >= 0; i--) {
      popups[i].life--; popups[i].y -= 0.5;
      if (popups[i].life <= 0) popups.splice(i, 1);
    }
  }

  // Dim buttons that can't do anything right now
  const uiCache = {};
  function updateButtons() {
    const canPunch = !mac.tired;
    const canStar = mac.stars > 0 && !mac.tired;
    if (uiCache.p !== canPunch) {
      uiCache.p = canPunch;
      ['faceL', 'faceR', 'bodyL', 'bodyR'].forEach(a => btnFor(a).classList.toggle('disabled', !canPunch));
    }
    if (uiCache.s !== canStar) { uiCache.s = canStar; btnFor('star').classList.toggle('disabled', !canStar); }
  }

  function render() {
    syncControls();
    if (game.phase === 'title') { drawTitle(); return; }
    if (game.phase === 'matchup') { drawMatchup(); return; }
    ctx.save();
    if (game.shake > 0) ctx.translate((Math.random() - 0.5) * game.shake, (Math.random() - 0.5) * game.shake);
    drawRing();
    drawOpponent();
    drawPlayer();
    drawPopups();
    drawPhaseText();
    ctx.restore();
    drawHUD();
    updateButtons();
  }

  // =====================================================================
  // OPENING SEQUENCE — title screen, then the pre-fight matchup card.
  // Drawn on the game canvas; the fight buttons are hidden meanwhile.
  // =====================================================================
  const TITLE_ART = { w: 976, h: 838 };                 // original size of the title art
  const KMAN_FACE = { x: 240, y: 0, w: 280, h: 336 };   // portrait crop, in original-art pixels
  const PLAYER_CARD = {
    name: 'KMAN',
    lines: [                                   // [text, color], left-aligned in the space beside his portrait
      ['FROM', '#aaa'],
      ['PHILLY', '#fff'],
      ['(AKA MEDIA, PA)', '#fff'],
      ['', ''],
      ['KINDA TALL', '#fff'],
      ['LOOKING SINEWY', '#fff'],
      ['', ''],
      ['NO PERMANENT', '#fff'],
      ['RECORD', '#fff'],
    ],
  };
  const MENU = [{ label: 'NEW', y: 432 }, { label: 'CONTINUE', y: 468 }];
  const isScreen = () => game.phase === 'title' || game.phase === 'matchup';

  function drawGlove(x, y, flip) {
    const g = getImage('glove');
    if (!g) { ctx.fillStyle = '#c0392b'; ctx.fillRect(x - 8, y - 6, 16, 12); return; }
    const w = 26, h = Math.round(g.height * 26 / g.width);
    ctx.save();
    ctx.translate(x, y);
    if (flip) ctx.scale(-1, 1);
    ctx.drawImage(g, -w / 2, -h / 2, w, h);
    ctx.restore();
  }
  function text(str, x, y, size, color, align = 'center') {
    ctx.font = `${size}px ${FONT}`;
    ctx.textAlign = align;
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }
  const blinkOn = t => Math.floor(t / 30) % 2 === 0;

  function drawTitle() {
    const t = game.t;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = Math.min(1, t / 45);
    const art = getImage('title');
    const artH = Math.round(W * TITLE_ART.h / TITLE_ART.w);
    if (art) ctx.drawImage(art, 0, 70, W, artH);
    ctx.globalAlpha = Math.min(1, Math.max(0, (t - 30) / 30));

    MENU.forEach((m, i) => {
      const disabled = m.label === 'CONTINUE' && !game.hasSave;
      text(m.label, W / 2, m.y, 12, disabled ? '#777' : '#fff');
      if (i === game.menuIdx) {
        const bob = Math.round(Math.sin(t * 0.2) * 3);
        const half = m.label.length * 6 + 26;
        drawGlove(W / 2 - half - bob, m.y - 5, false);
        drawGlove(W / 2 + half + bob, m.y - 5, true);
      }
    });
    if (game.menuMsg > 0) text('NO SAVED FIGHT YET', W / 2, 500, 8, '#ff9a9a');
    else if (t > 60 && blinkOn(t)) text('TAP TO START', W / 2, 520, 10, '#ffd23f');
    text('A FAN TRIBUTE · NOT AFFILIATED WITH NINTENDO', W / 2, 620, 6, '#666');
    ctx.globalAlpha = 1;

    if (game.leave > 0) {                                   // white flash on START, like the NES
      ctx.fillStyle = `rgba(255,255,255,${game.leave / 14})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawMatchup() {
    const t = game.t;
    const slide = k => Math.round((1 - Math.min(1, k)) ** 2 * W);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    text('MINOR CIRCUIT', W / 2, 44, 12, '#ffd23f');
    text('MATCH 1', W / 2, 66, 8, '#aaa');

    // opponent card — slides in from the left
    ctx.save();
    ctx.translate(-slide(t / 25), 0);
    drawPortraitBox(18, 90, 150, 180, () => drawFrame('joe', 'R0.0', 93, 90 + 330, 1.55));
    text(F.name, 184, 120, 11, '#fff', 'left');
    text('FROM', 184, 148, 7, '#aaa', 'left');
    F.from.split(', ').forEach((l, i) => text(l + (i === 0 ? ',' : ''), 184, 164 + i * 14, 8, '#fff', 'left'));
    text(`RECORD ${F.record}`, 184, 214, 8, '#fff', 'left');
    if (F.stats) text(F.stats, 184, 232, 7, '#aaa', 'left');
    ctx.restore();

    if (t > 20) text('VS', W / 2, 322, 22, '#e0475a');

    // player card — slides in from the right
    ctx.save();
    ctx.translate(slide((t - 10) / 25), 0);
    drawPortraitBox(192, 350, 150, 180, () => {
      const art = getImage('title');
      if (!art) return;
      const s = art.width / TITLE_ART.w;
      ctx.drawImage(art, KMAN_FACE.x * s, KMAN_FACE.y * s, KMAN_FACE.w * s, KMAN_FACE.h * s, 192, 350, 150, 180);
    });
    const cardX = 40;                                     // left edge of Kman's text block
    text(PLAYER_CARD.name, cardX, 380, 11, '#fff', 'left');
    PLAYER_CARD.lines.forEach(([l, c], i) => { if (l) text(l, cardX, 408 + i * 16, 7, c, 'left'); });
    ctx.restore();

    if (t > 50 && blinkOn(t)) text('TAP TO FIGHT', W / 2, 590, 10, '#ffd23f');
  }

  function drawPortraitBox(x, y, w, h, drawInside) {
    ctx.fillStyle = '#1d2a5c';
    ctx.fillRect(x, y, w, h);
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    drawInside();
    ctx.restore();
    ctx.strokeStyle = '#ffd23f';
    ctx.lineWidth = 3;
    ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
  }

  function updateScreens() {
    if (game.menuMsg > 0) game.menuMsg--;
    if (game.phase === 'title' && game.leave > 0 && --game.leave === 0) setPhase('matchup');
  }

  function screenTap(x, y) {
    if (game.phase === 'title') {
      if (game.leave > 0) return;
      if (game.t < 60) { game.t = 60; return; }             // first tap skips the fade-in
      const hit = MENU.findIndex(m => Math.abs(y - (m.y - 5)) < 18);
      if (hit >= 0 && hit !== game.menuIdx) { game.menuIdx = hit; SFX.play('menu'); }
      if (MENU[game.menuIdx].label === 'CONTINUE' && !game.hasSave) { game.menuMsg = 90; SFX.play('miss'); return; }
      game.leave = 14;
      SFX.play('confirm');                                      // NEW: flash, then matchup card
    } else if (game.phase === 'matchup') {
      if (game.t < 50) { game.t = 50; return; }             // first tap skips the slide-in
      startRound(1);
    }
  }
  canvas.addEventListener('pointerdown', e => {
    if (!isScreen()) return;
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    screenTap((e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height);
  });

  const controlsEl = document.getElementById('controls');
  let controlsShown = null;
  function syncControls() {
    const show = !isScreen();
    if (show !== controlsShown) { controlsShown = show; controlsEl.style.visibility = show ? 'visible' : 'hidden'; }
  }

  // =====================================================================
  // MAIN LOOP — fixed 60 ticks/sec simulation
  // =====================================================================
  function fixedUpdate() {
    game.t++;
    switch (game.phase) {
      case 'title': case 'matchup': updateScreens(); break;
      case 'intro':
        if (game.t === 50) SFX.play('bell');           // opening bell as FIGHT! appears
        if (game.t >= 90) setPhase('fight');
        break;
      case 'fight':   updateClock(); if (game.phase === 'fight') { updateMac(); updateOpp(); } break;
      case 'oppDown': updateOppDown(); break;
      case 'macDown': updateMacDown(); break;
    }
    updatePopups();
    if (game.shake > 0) game.shake--;
    consumePressed();
  }

  const STEP = 1000 / 60;
  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min(now - last, 250);
    last = now;
    let n = 0;
    while (acc >= STEP && n < 5) { fixedUpdate(); acc -= STEP; n++; }
    if (n === 5) acc = 0;
    render();
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => {
    last = performance.now(); acc = 0;
    if (document.hidden) releaseAll();
  });

  newMatch();
  resetMacRound();
  resetOppStance();
  requestAnimationFrame(frame);

})();
</script>
</body>
</html>
